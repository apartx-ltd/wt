name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Some tests spawn npm/npx (the node plugin, dotenvx) — preinstalled on ubuntu-latest.
      - name: Test
        run: bun test

      - name: Build web dashboard
        run: bun run build:web
