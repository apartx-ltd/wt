name: release

on:
  push:
    tags: ["v*"]

# id-token: write lets npm verify this workflow through GitHub OIDC (trusted publishing):
# no NPM_TOKEN secret, and every release carries a provenance attestation.
# The trusted publisher (repository apartx-ltd/wt, workflow release.yml) is configured in the
# package settings on npmjs.com; the first version was published by hand because npm cannot
# create a package through OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # `bun publish` cannot use OIDC yet, so the tarball is published with the npm CLI,
      # which needs npm 11.5.1 or newer for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install -g npm@11

      - name: Tag matches package.json version
        run: |
          version="v$(bun -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Some tests spawn npm/npx (the node plugin, dotenvx) — preinstalled on ubuntu-latest.
      - name: Test
        run: bun test

      # No explicit build:web step: `prepack` builds web/build when the tarball is packed.
      - name: Pack
        run: |
          bun pm pack
          ls apartx-wt-*.tgz

      # Skipping an already published version keeps a re-run (or the tag of a version that
      # was published by hand) green instead of failing on "cannot publish over" from npm.
      - name: Publish to npm
        run: |
          name="$(bun -p 'require("./package.json").name')"
          version="$(bun -p 'require("./package.json").version')"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm, skipping publish"
            exit 0
          fi
          npm publish ./apartx-wt-*.tgz --access public --provenance
